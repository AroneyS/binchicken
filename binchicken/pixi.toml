[workspace]
authors = ["AroneyS <samuel.aroney@qut.edu.au>"]
channels = ["conda-forge", "bioconda", "rpetit3"]
name = "binchicken"
platforms = ["linux-64"]

[feature.main.dependencies]
python = "3.11.*"
snakemake = "9.22.*"
snakemake-executor-plugin-cluster-generic = ">=1"
bird_tool_utils_python = ">=0.5.1"
extern = "0.4.*"
"ruamel.yaml" = ">=0.15.99"
polars = "1.36.*"
pigz = "2.3.*"
pyarrow = "12.0.*"
parallel = "==20230522"
sourmash = "4.8.*"
sourmash_plugin_branchwater = "0.9.*"
# see https://github.com/pyca/cryptography/issues/7959#issuecomment-1368711852
pyopenssl = ">22.1.0"
pixi = ">=0.72.1"
conda = "*"
pip = "*"

[feature.main.tasks]
postinstall-base = { cmd = "pip uninstall -y binchicken || true && pip install --no-build-isolation --no-deps --disable-pip-version-check -e ..", cwd = "binchicken" }
build_dep_defs = { cmd = "python ../admin/build_dep_defs_from_pixi.py", depends-on = ["postinstall"] }

[tasks.postinstall]
# install into both standard and dev envs
depends-on = [
    { task = "postinstall-base", environment = "default" },
    { task = "postinstall-base", environment = "dev" }
]

[tasks.run-a-test-base]
args = ["test_name"]
cmd = "pytest test --run-expensive -k {{ test_name }}"
depends-on = [
    {task = "postinstall-base", environment = "default" },
    {task = "postinstall-base", environment = "dev" },
]

[tasks.run-a-test]
args = ["test_name"]
depends-on = [
    # run postinstall in the dev environment
    { task = "postinstall-base", environment = "dev" },
    # then run the tests in the same env
    {task = "run-a-test-base", environment = "dev", args = [ "{{ test_name }}" ] }
]

[tasks.run-a-qsub-test-base]
args = ["test_name"]
cmd = "pytest test --run-expensive --run-qsub -k {{ test_name }}"
depends-on = [
    {task = "postinstall-base", environment = "default" },
    {task = "postinstall-base", environment = "dev" },
]

[tasks.run-a-qsub-test]
args = ["test_name"]
depends-on = [
    # run postinstall in the dev environment
    { task = "postinstall-base", environment = "dev" },
    # then run the tests in the same env
    {task = "run-a-qsub-test-base", environment = "dev", args = [ "{{ test_name }}" ] }
]

[tasks.run-quick-tests-base]
cmd = "pytest test"
depends-on = [
    {task="postinstall-base", environment = "default"},
    {task="postinstall-base", environment = "dev"},
]

[tasks.run-quick-tests]
depends-on = [
    # then run the tests in the same env
    {task = "run-quick-tests-base", environment = "dev" }
]

[tasks.build]
cmd = "binchicken build"
depends-on = [
    { task = "postinstall-base", environment = "dev" }
]

[tasks.run-tests-at-cmr-base]
cmd = "test/run_tests_at_cmr"
depends-on = [
    {task="build", environment = "dev"}
]

[tasks.run-tests-at-cmr]
depends-on = [
    { task = "run-tests-at-cmr-base", environment = "dev" }
]

[feature.dev.dependencies]
pytest = "*"
ipython = "*"
toml = "*"
pandoc = "*"

[environments]
default = ["main"]
dev = ["dev", "main"]
general = ["general"]
aviary = ["aviary"]
coverm = ["coverm"]
fastp = ["fastp"]
kingfisher = ["kingfisher"]
prodigal = ["prodigal"]
r = ["r"]
singlem = ["singlem"]

[feature.general.dependencies]
parallel = "==20230522"

[feature.aviary.dependencies]
aviary = ">=0.13.2"
snakemake-executor-plugin-cluster-generic = ">=1"
conda = "*"
pixi = ">=0.72.1"

[feature.coverm.dependencies]
coverm = ">=0.8.0"

[feature.fastp.dependencies]
fastp = "1.3.*"

[feature.kingfisher.dependencies]
kingfisher = "0.5.*"
"aspera-connect" = "*"
sra-tools = "3.2.*"

[feature.prodigal.dependencies]
prodigal = "2.6.*"

[feature.r.dependencies]
python = ">=3.10"
r-base = "==4.1.3"
r-essentials = "*"
r-tidyverse = "==1.3.1"
r-cowplot = "*"
r-gt = "<=0.6.0"
r-webshot = "<=0.5.4"
r-optparse = "*"

[feature.singlem.dependencies]
singlem = "0.21.*"
diamond = "<=2.2.1"
