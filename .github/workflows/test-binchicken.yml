name: Test Bin Chicken
on: [push, pull_request]

jobs:
  pixi_test_dependencies_locked:
    name: Pixi test_dependencies_locked ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Prepare pixi folder
        run: |
          pwd
          echo "Contents of current directory:"
          ls -la
          mkdir -p binchicken/.pixi
          echo "Contents of binchicken directory:"
          ls -la binchicken

      # Needed due to pixi run -e default breaking for import binchicken.
      # Not `pixi run postinstall`: its cwd = "binchicken" is invalid when the manifest is in binchicken/
      - name: Create default environment
        run: |
          pixi run --manifest-path binchicken/pixi.toml pip install --no-build-isolation --no-deps --disable-pip-version-check -e .
          pixi run --manifest-path binchicken/pixi.toml pixi info
          pixi run --manifest-path binchicken/pixi.toml binchicken -h

      - name: Create dev environment
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev pip install --no-build-isolation --no-deps --disable-pip-version-check -e .
          pixi run --manifest-path binchicken/pixi.toml -e dev pixi info

      # Inner envs are run with --as-is, so install them up front as users do.
      # All pixi calls use binchicken/pixi.toml directly: the repo-root symlinks give a
      # second path to the same envs, which pixi rejects as "environment directory has moved"
      - name: Install subworkflow environments
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev binchicken build --skip-aviary-envs

      - name: Show environment info
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev pixi list

      - name: Run tests with Pixi
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev binchicken -h
          pixi run --manifest-path binchicken/pixi.toml -e dev pytest -v

  # Run after removing lock file so dependences are unlocked
  pixi_test_dependencies_optimistic:
    name: Pixi test_dependencies_optimistic ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Prepare pixi folder
        run: |
          pwd
          echo "Contents of current directory:"
          ls -la
          mkdir -p binchicken/.pixi
          echo "Contents of binchicken directory:"
          ls -la binchicken

      - name: Remove lock file
        run: |
          rm -fv pixi.lock binchicken/pixi.lock admin/requirements.txt
          touch admin/requirements.txt

      # Needed due to pixi run -e default breaking for import binchicken.
      # Not `pixi run postinstall`: its cwd = "binchicken" is invalid when the manifest is in binchicken/
      - name: Create default environment
        run: |
          pixi run --manifest-path binchicken/pixi.toml pip install --no-build-isolation --no-deps --disable-pip-version-check -e .
          pixi run --manifest-path binchicken/pixi.toml pixi info
          pixi run --manifest-path binchicken/pixi.toml binchicken -h

      - name: Create dev environment
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev pip install --no-build-isolation --no-deps --disable-pip-version-check -e .
          pixi run --manifest-path binchicken/pixi.toml -e dev pixi info

      # Inner envs are run with --as-is, so install them up front as users do.
      # All pixi calls use binchicken/pixi.toml directly: the repo-root symlinks give a
      # second path to the same envs, which pixi rejects as "environment directory has moved"
      - name: Install subworkflow environments
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev binchicken build --skip-aviary-envs

      - name: Show environment info
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev pixi list

      - name: Run tests with Pixi
        run: |
          pixi run --manifest-path binchicken/pixi.toml -e dev binchicken -h
          pixi run --manifest-path binchicken/pixi.toml -e dev pytest -v
